syntax = "proto3";

package auth.v1;

service Authenticator {
    rpc Authenticate (AuthRequest) returns (AuthResult);
    rpc Register (RegisterRequest) returns (RegisterResult);
}

message AuthRequest {
    string username = 1;
    string password = 2;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    Role role = 3;
}

message AuthResult {
    bool authenticated = 1;
    Role role = 2;
    string token = 3;
    string message = 4;
}

message RegisterResult {
    bool success = 1;
    string message = 2;
}

enum Role {
    UNSPECIFIED = 0;
    STUDENT = 1;
    TEACHER = 2;
}